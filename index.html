    <!-- Open Graph -->

    <meta property="og:title" content="RebalanceKit - Tax-Smart Portfolio Rebalancing" />
    <meta property="og:description" content="Calculate exact portfolio rebalancing trades in seconds. Tax-efficient add-only mode, health scoring, and AI analysis." />

    <!-- Twitter Card -->

    <meta name="twitter:description" content="Calculate exact portfolio rebalancing trades in seconds. Tax-efficient add-only mode, health scoring, and AI analysis." />
    <meta name="twitter:image" content="https://rebalancekit.com/og-image.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "RebalanceKit",
      "url": "https://rebalancekit.com",
      "description": "Calculate exact portfolio rebalancing trades in seconds. Tax-efficient add-only mode, health scoring, AI analysis, and PDF reports.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Any",
      "offers": [
        {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free plan with basic rebalancing"
        },
        {
          "@type": "Offer",
          "price": "9",
          "priceCurrency": "USD",
          "description": "Pro plan with AI analysis, PDF reports, and cloud sync"
        }
      ]
    }
    </script>

    <!-- Preconnect to Supabase -->
    <link rel="preconnect" href="https://gfuarcyulekmrkivcjzk.supabase.co" />
    <link rel="dns-prefetch" href="https://gfuarcyulekmrkivcjzk.supabase.co" />

    <!-- Prevent white flash by applying theme before render -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (!theme) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <!-- Gumroad overlay checkout -->
    <script src="https://gumroad.com/js/gumroad.js" async></script>
    <style>
      /* Prevent flash of unstyled content */
      html { background-color: #FAFAFA; }
      html.dark { background-color: #0A0A0A; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
